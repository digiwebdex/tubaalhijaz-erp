# TUBA AL HIJAZ — CI/CD
# push→main: install → lint → e2e (Phase 14 suite) → build → push images → (manual) deploy.
# PRs run test only. Images go to GHCR (ghcr.io) with the built-in GITHUB_TOKEN.
# Required repo secrets/vars are listed in docs/CICD.md.
name: CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/tuba-alhijaz-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/tuba-alhijaz-web
  PNPM_VERSION: "11.13.1"
  NODE_VERSION: "22"

jobs:
  # ── 1. Install · lint · test (Phase 14 suite) · build ────────────────────────
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test                     # disables rate-limiting for the e2e storm
      DATABASE_URL: postgresql://tuba:tuba_ci@localhost:5432/tuba_al_hijaz?schema=public
      REDIS_URL: redis://localhost:6379/3
      MINIO_ENDPOINT: localhost
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin_ci
      STORAGE_BUCKET: tuba-docs
      JWT_SECRET: ci_only_secret_do_not_use_in_prod_0123456789
      JWT_EXPIRES_IN: 15m
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build shared + generate Prisma client
        run: |
          pnpm --filter @tuba/shared build
          pnpm --filter @tuba/api exec prisma generate

      - name: Lint (typecheck)
        run: pnpm --filter @tuba/api lint

      - name: Start backing services (postgres · redis · minio)
        run: |
          cat > infra/.env <<'EOF'
          POSTGRES_USER=tuba
          POSTGRES_PASSWORD=tuba_ci
          POSTGRES_DB=tuba_al_hijaz
          MINIO_ROOT_USER=minioadmin
          MINIO_ROOT_PASSWORD=minioadmin_ci
          STORAGE_BUCKET=tuba-docs
          EOF
          docker compose -f infra/docker-compose.yml up -d --wait postgres redis minio

      - name: Migrate + seed the test database
        run: |
          pnpm --filter @tuba/api exec prisma migrate deploy
          pnpm --filter @tuba/api db:seed

      - name: E2E test suite (Phase 14 — 178 tests, runInBand)
        run: pnpm --filter @tuba/api test:e2e

      - name: Build API + Web
        run: |
          pnpm --filter @tuba/api build
          pnpm --filter @tuba/web build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:3210' }}

      - name: Tear down services
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  # ── 2. Build + push images to GHCR (main OR staging, after tests pass) ───────
  # Both branches publish an immutable :<sha> tag — that tag is what deploy and
  # rollback target. Moving tags differ so they can never be confused:
  #   main    → :latest      staging → :staging
  build-push:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                    # ghcr push via GITHUB_TOKEN — no extra secret
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.web
          push: true
          # VITE_API_URL is baked into the SPA bundle at build time, so the staging
          # and production web images are NOT interchangeable — each points at its
          # own origin. Wrong value here = staging calling the live API.
          build-args: |
            VITE_API_URL=${{ github.ref == 'refs/heads/main' && vars.VITE_API_URL || vars.VITE_API_URL_STAGING }}
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3a. Deploy to STAGING (automatic — no approval gate; that is the point) ──
  # Isolation from production is structural, not procedural:
  #   • different branch      (staging)
  #   • different directory   (/var/www/TUBAALHIJAZ-staging)
  #   • different compose project (-p tuba-staging ⇒ own containers/network/volumes)
  #   • different .env        (own DB creds, own JWT_SECRET, blank notification creds)
  # Nothing in this job can reach the production stack even if it goes wrong.
  deploy-staging:
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging                 # ← create WITHOUT required reviewers
    steps:
      - name: SSH deploy to staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /var/www/TUBAALHIJAZ-staging
            # Refuse to run if this checkout is not on the staging branch — the one
            # guard that catches a mis-provisioned box before it deploys anything.
            BR=$(git rev-parse --abbrev-ref HEAD)
            [ "$BR" = "staging" ] || { echo "FATAL: expected branch 'staging', found '$BR'"; exit 1; }
            git fetch origin staging --quiet
            git reset --hard origin/staging
            cd infra
            export REGISTRY="ghcr.io/${{ github.repository_owner }}"
            export IMAGE_TAG="${{ github.sha }}"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin || true
            docker compose -f docker-compose.prod.yml -f docker-compose.staging.yml -p tuba-staging pull
            docker compose -f docker-compose.prod.yml -f docker-compose.staging.yml -p tuba-staging up -d
            docker image prune -f
            # Persist the tag so a staging rollback uses the same mechanism as prod.
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${{ github.sha }}|" .env || true

  # ── 3b. Deploy to PRODUCTION (MANUAL approval via the 'production' environment) ──
  deploy:
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production              # ← configure required reviewers on this env (manual gate)
    steps:
      - name: SSH deploy (pull + up -d)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /var/www/TUBAALHIJAZ
            git pull --ff-only || true            # refresh compose files (repo cloned on the VPS)
            cd infra
            export REGISTRY="ghcr.io/${{ github.repository_owner }}"
            export IMAGE_TAG="${{ github.sha }}"
            # log in so a private GHCR package can be pulled (skip if the packages are public)
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin || true
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            # Persist the deployed tag. Without this, .env keeps the PREVIOUS tag and
            # any later bare `up -d` (or the rollback procedure, which edits .env)
            # would silently act on stale state.
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${{ github.sha }}|" .env || true
