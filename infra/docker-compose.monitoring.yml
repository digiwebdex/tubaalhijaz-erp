# TUBA AL HIJAZ — lightweight monitoring (Phase 18, item 1). Runs alongside the
# app stack, joins its network to scrape postgres/redis/api by name. Everything is
# loopback-bound; Grafana is fronted by nginx later. Storage is hard-capped so it
# can't fill the disk. Start: docker compose -f docker-compose.monitoring.yml up -d
name: tuba-monitoring

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: tuba-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d          # short retention (disk-constrained box)
      - --storage.tsdb.retention.size=512MB        # hard size cap — cannot fill the disk
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy: { resources: { limits: { memory: 512M, cpus: "0.5" } } }
    networks: [tuba, monitoring]

  grafana:
    image: grafana/grafana:latest
    container_name: tuba-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000"   # fronted by nginx at /grafana/
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy: { resources: { limits: { memory: 256M, cpus: "0.5" } } }
    networks: [monitoring]

  node-exporter:
    image: prom/node-exporter:latest
    container_name: tuba-node-exporter
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    volumes: ["/:/host:ro,rslave"]
    pid: host
    deploy: { resources: { limits: { memory: 128M, cpus: "0.25" } } }
    networks: [monitoring]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: tuba-cadvisor
    restart: unless-stopped
    privileged: true
    devices: ["/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    deploy: { resources: { limits: { memory: 256M, cpus: "0.5" } } }
    networks: [monitoring]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: tuba-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    deploy: { resources: { limits: { memory: 128M, cpus: "0.25" } } }
    networks: [tuba, monitoring]

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: tuba-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
      # BullMQ queue depth: list/zset lengths per queue+state (prefix "tuba")
      REDIS_EXPORTER_CHECK_KEYS: "tuba:tuba-automation:wait,tuba:tuba-automation:active,tuba:tuba-automation:delayed,tuba:tuba-automation:failed,tuba:tuba-automation:completed,tuba:tuba-notify:wait,tuba:tuba-notify:active,tuba:tuba-notify:delayed,tuba:tuba-notify:failed,tuba:tuba-notify:completed"
    deploy: { resources: { limits: { memory: 128M, cpus: "0.25" } } }
    networks: [tuba, monitoring]

volumes:
  promdata:
  grafanadata:

networks:
  tuba:
    external: true
    name: tuba-alhijaz_tuba     # the app stack's network (scrape postgres/redis/api)
  monitoring:
    driver: bridge
