# TUBA AL HIJAZ — HOST nginx vhost for tubaalhijaz.com
# Deploy to: /etc/nginx/sites-available/tubaalhijaz.com
#            ln -s ../sites-available/tubaalhijaz.com /etc/nginx/sites-enabled/
#
# WHY THIS FILE EXISTS: without a server block claiming this server_name, nginx
# falls through to its DEFAULT TLS vhost — on this shared box that is
# alrawshaintl.com, so tubaalhijaz.com served a completely different project
# (frontend AND /api/). Presenting CN=alrawshaintl.com for SNI tubaalhijaz.com
# is the signature of exactly that fault.
#
# NOT the same as infra/nginx.web.conf, which is the SPA config INSIDE the web
# container. This one is the host reverse proxy in front of the containers.
#
# PORTS: must match infra/.env on the VPS. Production currently uses
# WEB_PORT=8095 and API_PORT=3210, bound to 127.0.0.1 (Phase 18). Verify with:
#   grep -E '^(WEB_PORT|API_PORT|BIND_ADDR)=' /var/www/TUBAALHIJAZ/infra/.env

# Restore the real client IP from Cloudflare (the domain is CF-proxied, so
# without this every request appears to come from a Cloudflare edge address —
# which breaks rate limiting and makes logs useless).
# Ranges: https://www.cloudflare.com/ips/  (refresh occasionally)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# WebSocket upgrade map. Deliberately named $tuba_connection_upgrade rather than
# the conventional $connection_upgrade: this box is shared with other projects,
# and if any of their vhosts already defines that name, nginx refuses to start
# with "duplicate map". A unique name cannot collide.
map $http_upgrade $tuba_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name tubaalhijaz.com www.tubaalhijaz.com;

    # Leave ACME reachable so certbot renewals keep working.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # NOTE: no `http2 on;` — that directive needs nginx >= 1.25.1 and this box runs
    # 1.24.0, where it is an "unknown directive" that fails `nginx -t` outright.
    # HTTP/2 protocol options are per-listen-socket and other vhosts on this box
    # already enable http2 for :443, so the socket has it regardless. Cloudflare
    # also terminates HTTP/2 with the browser, so the origin hop matters little.
    server_name tubaalhijaz.com www.tubaalhijaz.com;

    # certbot --nginx -d tubaalhijaz.com -d www.tubaalhijaz.com writes these.
    # (Alternative: a Cloudflare Origin Certificate — then point these at the
    # origin cert/key instead and set CF SSL mode to Full (strict).)
    ssl_certificate     /etc/letsencrypt/live/tubaalhijaz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tubaalhijaz.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Uploads go to MinIO via presigned PUT from the browser, but agent document
    # uploads still POST through the API — keep this generous.
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/tubaalhijaz.access.log;
    error_log  /var/log/nginx/tubaalhijaz.error.log;

    # ── API ───────────────────────────────────────────────────────────────────
    # Trailing slash on proxy_pass strips the /api prefix: /api/health → /health.
    # This block also carries the Ops WebSocket: the SPA connects with
    # path "/api/socket.io" (see apps/web/src/app/lib/opsSocket.ts), so the
    # Upgrade/Connection headers MUST be here or live ops silently degrades to
    # polling — or fails outright.

    # S1-04: Prometheus scrape must NOT be reachable on the public internet.
    # Scrapers use the docker network (http://api:3210/metrics) — see
    # infra/monitoring/prometheus.yml. API remains loopback-bound on the host.
    location ^~ /api/metrics {
        deny all;
        return 404;
        access_log off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3210/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tuba_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # long-lived socket.io connections
        proxy_send_timeout 300s;
    }

    # ── SPA ───────────────────────────────────────────────────────────────────
    # Everything else goes to the web container, which serves index.html for
    # client-side routes (/dashboards, /automation, /ops-control, …).
    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
