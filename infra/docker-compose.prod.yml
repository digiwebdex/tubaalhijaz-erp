# TUBA AL HIJAZ — production stack. Run from infra/:
#   cp .env.example .env  &&  edit secrets
#   IMAGE_TAG=$(git rev-parse --short HEAD) docker compose -f docker-compose.prod.yml up -d --build
# (or: make -C infra prod). Env comes from infra/.env. Data survives restarts via named volumes.
name: tuba-alhijaz

x-restart: &restart unless-stopped

services:
  # ── Postgres ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 768M, cpus: "1.0" }
    networks: [tuba]

  # ── Redis (BullMQ + dashboard cache) ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: *restart
    # cap memory so an unbounded queue/cache can't OOM the VPS (LRU on the cache keys)
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.5" }
    networks: [tuba]

  # ── MinIO — THE single source of truth for uploaded files ─────────────────────
  # All persisted files (documents, vouchers, invoices, QR, backups) live here on
  # the `miniodata` volume. The API's local-disk driver is inactive whenever
  # MINIO_ENDPOINT is set, so there is deliberately no second on-disk store.
  minio:
    image: minio/minio:latest        # pin to a dated RELEASE.* tag for real prod
    restart: *restart
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${MINIO_PORT:-9000}:9000"   # browser presigned uploads (front via nginx)
      - "${BIND_ADDR:-0.0.0.0}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 512M, cpus: "0.5" }
    networks: [tuba]

  # ── One-shot: create the bucket (gates the API until MinIO is truly ready) ────
  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; do echo 'waiting for minio…'; sleep 2; done;
      mc mb --ignore-existing local/$$STORAGE_BUCKET;
      echo 'bucket ready';
      "
    networks: [tuba]

  # ── API (NestJS) ──────────────────────────────────────────────────────────────
  api:
    # REGISTRY is 'ghcr.io/<owner>' on the VPS (so `docker compose pull` works) and
    # defaults to a local namespace for local builds. Tag = git SHA (CI/CD + rollback).
    # Independent tag so web and api can never collide. Falls back to the legacy
    # shared IMAGE_TAG, then latest, so older commands keep working.
    image: ${REGISTRY:-tuba-alhijaz}/tuba-alhijaz-api:${API_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: *restart
    env_file: [.env]
    volumes:
      - /etc/secrets/google-vision.json:/etc/secrets/google-vision.json:ro
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3210"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379/3
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      CORS_ORIGIN: ${WEB_ORIGIN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${API_PORT:-3210}:3210"   # front via nginx
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3210/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits: { memory: 768M, cpus: "1.0" }
    networks: [tuba]

  # ── Web (Nginx SPA) ──────────────────────────────────────────────────────────
  web:
    # Independent tag so web and api can never collide. Falls back to the legacy
    # shared IMAGE_TAG, then latest, so older commands keep working.
    image: ${REGISTRY:-tuba-alhijaz}/tuba-alhijaz-web:${WEB_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3210}
    restart: *restart
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 128M, cpus: "0.25" }
    networks: [tuba]

volumes:
  pgdata:
  redisdata:
  miniodata:      # the only persisted file store (see the minio service note)

networks:
  tuba:
    driver: bridge
