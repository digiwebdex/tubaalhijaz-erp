# TUBA AL HIJAZ — Prometheus scrape config (lightweight; 30s interval).
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  external_labels: { stack: tuba-alhijaz }

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]

  - job_name: node            # host CPU/mem/disk/network
    static_configs: [{ targets: ["tuba-node-exporter:9100"] }]

  - job_name: cadvisor        # per-container health/CPU/mem/restarts
    static_configs: [{ targets: ["tuba-cadvisor:8080"] }]

  - job_name: postgres        # connection count + pg_stat
    static_configs: [{ targets: ["tuba-postgres-exporter:9187"] }]

  - job_name: redis           # redis + BullMQ queue depth (check-keys)
    static_configs: [{ targets: ["tuba-redis-exporter:9121"] }]

  - job_name: api             # app HTTP latency/error rates (needs /metrics — added separately)
    metrics_path: /metrics
    static_configs: [{ targets: ["api:3210"] }]
