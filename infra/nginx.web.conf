# TUBA AL HIJAZ — SPA static server. Serves the built Vite app and falls back to
# index.html for client-side routes (react-router). The API is a separate origin
# (VITE_API_URL) — this server does NOT proxy it, because the SPA's client routes
# (/dashboards, /automation, /ops-control…) collide with API paths (/dashboards,
# /automation, /ops…). See infra/README.md.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # gzip text assets
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Long-cache the content-hashed build assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: unknown paths return index.html (client router takes over).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Never cache the entry document.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
